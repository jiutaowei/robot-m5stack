; ============================================================
; StackChan (CoreS3 / ESP32-S3) PlatformIO 工程骨架
; ============================================================
; 板卡: m5stack-cores3 (ESP32-S3 / 240MHz / 16MB Flash / 320KB RAM)
; 框架: Arduino (与 Arduino IDE 示例一致)
;
; 烧录前: 长按侧边 RST 键约 3 秒, 绿灯亮后松开, 进入下载模式
; 串口监视: pio device monitor  (波特率 115200)
; ============================================================

[platformio]
default_envs = m5stack-cores3

[env:m5stack-cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino

monitor_speed = 115200
upload_protocol = esptool

; 编译定义
build_flags =
    -DARDUINO_M5STACK_CORES3

; 依赖库(通过 PlatformIO Registry 自动安装)
; 注意: M5StackChan 库若 Registry 中不可用, 需改用本地引入:
;   lib_extra_dirs = <本地库路径>  或将库放入 lib/ 目录
lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX
